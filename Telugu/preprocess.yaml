dataset: LJSpeech
path:
  corpus_path: ''
  lexicon_path: lexicon/librispeech-lexicon.txt
  raw_path: /kaggle/working/FastSpeech2/Telugu/preprocess_input
  preprocessed_path: /kaggle/working/FastSpeech2/Telugu/preprocessed
preprocessing:
  val_size: 0
  text:
    text_cleaners:
    - telugu_cleaners
    language: te
  audio:
    sampling_rate: 22050
    max_wav_value: 32768.0
  stft:
    filter_length: 1024
    hop_length: 256
    win_length: 1024
  mel:
    n_mel_channels: 80
    mel_fmin: 0
    mel_fmax: 8000
  pitch:
    feature: phoneme_level
    normalization: true
  energy:
    feature: phoneme_level
    normalization: true
